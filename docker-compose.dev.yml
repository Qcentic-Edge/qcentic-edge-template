name: filament-dev

x-app: &app
  build:
    context: ./app
    target: dev
  image: ${DEV_IMAGE_NAME:-filament-app:dev}
  env_file:
    - .env.docker.dev
  environment:
    DB_CONNECTION: libsql
    DB_URL: ${DB_URL:-http://db:8080}
  volumes:
    - ./app:/app
    - /app/vendor
    - /app/node_modules

services:
  # Local libSQL server (sqld) — same Hrana protocol as Bunny Database.
  db:
    image: ghcr.io/tursodatabase/libsql-server:latest
    restart: unless-stopped
    command: ["/bin/sqld"]
    environment:
      SQLD_DB_PATH: /var/lib/sqld/db
    ports:
      - "${DB_HOST_PORT:-8080}:8080"
    volumes:
      - db_data:/var/lib/sqld

  migrate:
    <<: *app
    command: ["php", "artisan", "migrate", "--force"]
    restart: "no"
    healthcheck:
      disable: true
    depends_on:
      - db

  app:
    <<: *app
    restart: unless-stopped
    command: ["php", "artisan", "serve", "--host=0.0.0.0", "--port=8080"]
    ports:
      - "${HTTP_PORT:-8090}:8080"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS -o /dev/null http://127.0.0.1:8080/up || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    depends_on:
      - migrate

  vite:
    image: node:22-alpine
    restart: unless-stopped
    working_dir: /app
    environment:
      # Makes laravel-vite-plugin bind 0.0.0.0 and write the hot file
      # as http://localhost:5173 (same behavior as Laravel Sail).
      LARAVEL_SAIL: 1
    command: sh -c "npm install --no-audit --no-fund && npm run dev"
    ports:
      - "${VITE_PORT:-5173}:5173"
    volumes:
      - ./app:/app
      - npm_cache:/root/.npm

volumes:
  db_data:
  npm_cache:
