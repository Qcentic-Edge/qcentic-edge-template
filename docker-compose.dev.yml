name: filament-dev

x-app: &app
  build:
    context: ./app
    target: dev
  image: ${DEV_IMAGE_NAME:-filament-app:dev}
  env_file:
    - .env.docker.dev
  environment:
    DB_CONNECTION: libsql
    DB_URL: ${DB_URL:-http://db:8080}
  volumes:
    - ./app:/app
    - /app/vendor
    - /app/node_modules

services:
  # Local libSQL server (sqld) — same Hrana protocol as Bunny Database.
  db:
    image: ghcr.io/tursodatabase/libsql-server:latest
    restart: unless-stopped
    command: ["/bin/sqld"]
    environment:
      SQLD_DB_PATH: /var/lib/sqld/db
    ports:
      - "${DB_HOST_PORT:-8080}:8080"
    volumes:
      - db_data:/var/lib/sqld

  migrate:
    <<: *app
    command: ["php", "artisan", "migrate", "--force"]
    restart: "no"
    healthcheck:
      disable: true
    depends_on:
      - db

  app:
    <<: *app
    restart: unless-stopped
    command: ["php", "artisan", "serve", "--host=0.0.0.0", "--port=8080"]
    ports:
      - "${HTTP_PORT:-8090}:8080"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS -o /dev/null http://127.0.0.1:8080/up || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    depends_on:
      migrate:
        condition: service_started
      minio-init:
        condition: service_completed_successfully

  # Optional Redis for Reverb horizontal scale-out. Default Reverb is
  # in-memory; Laravel has no database persister for Reverb fan-out.
  # Enable with: --profile redis  and set REDIS_URL / REVERB_SCALING_ENABLED.
  redis:
    image: redis:7-alpine
    profiles:
      - redis
    restart: unless-stopped
    ports:
      - "${REDIS_HOST_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  reverb:
    <<: *app
    restart: unless-stopped
    command: ["php", "artisan", "reverb:start"]
    ports:
      - "${REVERB_HOST_PORT:-8081}:8080"
    healthcheck:
      disable: true
    depends_on:
      migrate:
        condition: service_started
      redis:
        condition: service_started
        required: false

  queue:
    <<: *app
    restart: unless-stopped
    command: ["php", "artisan", "queue:work", "--tries=3", "--timeout=60"]
    healthcheck:
      disable: true
    depends_on:
      - migrate

  vite:
    image: node:22-alpine
    restart: unless-stopped
    working_dir: /app
    env_file:
      - .env.docker.dev
    environment:
      # Makes laravel-vite-plugin bind 0.0.0.0 and write the hot file
      # as http://localhost:5173 (same behavior as Laravel Sail).
      LARAVEL_SAIL: 1
    command: sh -c "npm install --no-audit --no-fund && npm run dev"
    ports:
      - "${VITE_PORT:-5173}:5173"
    volumes:
      - ./app:/app
      - npm_cache:/root/.npm

  # Local S3-compatible object storage for FILESYSTEM_DISK=s3.
  minio:
    image: minio/minio
    restart: unless-stopped
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minio}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-miniosecret}
    ports:
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  minio-init:
    image: minio/mc
    restart: "no"
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minio}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-miniosecret}
      AWS_BUCKET: ${AWS_BUCKET:-filament}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        i=0
        until mc alias set local http://minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD"; do
          i=$$((i+1))
          [ "$$i" -gt 30 ] && exit 1
          sleep 1
        done
        mc mb --ignore-existing "local/$$AWS_BUCKET"

volumes:
  db_data:
  npm_cache:
  minio_data:
