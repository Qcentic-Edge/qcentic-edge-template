name: filament-prod

x-app: &app
  image: ${IMAGE_NAME:?set IMAGE_NAME in .env.docker.prod, e.g. <registry-user>/my-base-filament-template:latest}
  env_file:
    - .env.docker.prod
  environment:
    DB_CONNECTION: libsql
    # Explicit DB_URL wins; else the vars Bunny Database injects into Magic
    # Containers; else the bundled sqld service (used with --profile bundled-db).
    DB_URL: ${DB_URL:-${BUNNY_DATABASE_URL:-http://db:8080}}
    DB_AUTH_TOKEN: ${DB_AUTH_TOKEN:-${BUNNY_DATABASE_AUTH_TOKEN:-}}
  read_only: true
  tmpfs:
    - /tmp:uid=1000,gid=1000
    - /config:uid=1000,gid=1000
    - /data:uid=1000,gid=1000
    - /app/bootstrap/cache:uid=1000,gid=1000
  volumes:
    - app_storage:/app/storage
  security_opt:
    - no-new-privileges:true

services:
  # Optional local libSQL server (sqld) for full-stack testing of the prod
  # image on your own machine. Enable with: --profile bundled-db
  # Production on bunny.net uses Bunny Database instead (BUNNY_DATABASE_URL +
  # BUNNY_DATABASE_AUTH_TOKEN are injected when the DB is linked to the app).
  db:
    image: ghcr.io/tursodatabase/libsql-server:latest
    profiles:
      - bundled-db
    restart: unless-stopped
    command: ["/bin/sqld"]
    environment:
      SQLD_DB_PATH: /var/lib/sqld/db
    volumes:
      - db_data:/var/lib/sqld

  migrate:
    <<: *app
    # Waits for the remote database (managed or bundled) to accept
    # connections, then runs the migrations once.
    command:
      - sh
      - -c
      - |
        until php -r '$$u=@parse_url(getenv("DB_URL")); if(!$$u){exit(1);} $$tls=in_array($$u["scheme"]??"",["libsql","https","wss"]); $$p=$$u["port"]??($$tls?443:80); $$a=(($$tls)?"ssl://":"").$$u["host"].":".$$p; $$s=@stream_socket_client($$a,$$e,$$m,3); if($$s){fclose($$s);exit(0);} exit(1);'; do sleep 2; done
        php artisan migrate --force
    restart: "no"
    healthcheck:
      disable: true

  app:
    <<: *app
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-8080}:8080"
    depends_on:
      migrate:
        condition: service_completed_successfully

  queue:
    <<: *app
    restart: unless-stopped
    command: ["php", "artisan", "queue:work", "--tries=3", "--timeout=60"]
    healthcheck:
      disable: true
    depends_on:
      migrate:
        condition: service_completed_successfully

  # Optional Redis for Reverb horizontal scale-out. Default Reverb is
  # in-memory; Laravel has no database persister for Reverb fan-out.
  # Enable with: --profile redis  and set REDIS_URL / REVERB_SCALING_ENABLED.
  redis:
    image: redis:7-alpine
    profiles:
      - redis
    restart: unless-stopped
    ports:
      - "${REDIS_HOST_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  reverb:
    <<: *app
    restart: unless-stopped
    command: ["php", "artisan", "reverb:start"]
    ports:
      - "${REVERB_HOST_PORT:-8081}:8080"
    healthcheck:
      disable: true
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_started
        required: false

  scheduler:
    <<: *app
    restart: unless-stopped
    command: ["php", "artisan", "schedule:work"]
    healthcheck:
      disable: true
    depends_on:
      migrate:
        condition: service_completed_successfully

volumes:
  db_data:
  app_storage:
